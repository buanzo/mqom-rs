[package]
name = "mqom-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mqom = { version = "=0.0.0", path = ".." }
rand_core = { version = "0.10.1", default-features = false }

[workspace]
members = ["."]

[[bin]]
name = "public_api"
path = "fuzz_targets/public_api.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured_verify"
path = "fuzz_targets/structured_verify.rs"
test = false
doc = false
bench = false
